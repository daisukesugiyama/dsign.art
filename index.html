<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>D.sign</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500&family=Shippori+Mincho:wght@400&display=swap">
<style>
/* Layout: the door. The whole screen is the wall; one round hole is cut in it.
   Behind the wall is a work. You move the hole to look; you never see the whole.
   Click to go in. */
:root{
  --wall:#ebe9e6;
  --ink:#24211d;
  --ink-soft:#6c665e;
  --sig:#4988a2;
  --f-mark:"EB Garamond","Garamond",serif;
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  color-scheme:light;
}
html,body{height:100%;background:var(--wall);color:var(--ink)}
body{overflow:hidden;font-family:var(--f-display)}
.door{position:fixed;inset:0;cursor:pointer;touch-action:none;
  --x:50%;--y:50%;--r:min(19vmin,180px)}
.behind{position:absolute;inset:0;background:var(--wall);
  -webkit-mask-image:radial-gradient(circle var(--r) at var(--x) var(--y),#000 calc(100% - 1.5px),transparent 100%);
          mask-image:radial-gradient(circle var(--r) at var(--x) var(--y),#000 calc(100% - 1.5px),transparent 100%)}
.behind img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.04);transition:opacity 1.2s}
.behind img.loading{opacity:0}
/* a faint shadow inside the rim, so the hole reads as cut into the wall */
.rim{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle calc(var(--r) + 1px) at var(--x) var(--y),transparent calc(100% - 14px),rgba(36,33,29,.18) calc(100% - 1px),transparent 100%)}
.mark{position:absolute;left:max(24px,env(safe-area-inset-left,0px));top:calc(22px + env(safe-area-inset-top,0px));
  font-family:var(--f-mark);font-weight:500;font-size:25px;letter-spacing:.02em;color:var(--ink);pointer-events:none}
.mark .kd{margin-right:-.09em}.mark .kp{margin-right:-.04em}
.line{position:absolute;left:0;right:0;bottom:calc(30px + env(safe-area-inset-bottom,0px));text-align:center;
  font-size:clamp(14px,1.5vw,17px);color:var(--ink-soft);pointer-events:none;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.sig{position:absolute;right:max(24px,env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));
  width:clamp(96px,10vw,148px);height:auto;color:var(--sig);pointer-events:none}
.enter{position:absolute;inset:0;display:block;color:transparent;font-size:1px;outline:none}
.enter:focus-visible + .rim{background:radial-gradient(circle calc(var(--r) + 3px) at var(--x) var(--y),transparent calc(100% - 3px),var(--ink) calc(100% - 2px),transparent 100%)}
@media (max-width:560px){.line{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
</style>

</head>
<body>
<div class="door" id="door">
  <div class="behind"><img id="work" class="loading" alt="" decoding="async"></div>
  <a class="enter" href="home.html">D.sign に入る</a>
  <div class="rim" aria-hidden="true"></div>
  <span class="mark" aria-hidden="true"><span class="kd">D</span><span class="kp">.</span>sign</span>
  <p class="line" lang="en">Images about looking and the trouble with wanting.</p>
  <img class="sig" src="img/signature-blue.svg" alt="" aria-hidden="true">
</div>

<script>
(() => {
  // one work behind the wall per visit
  const WORKS = ['nagamu-front','kaze-front','street-front','dap-d1','raijin-d1','fujin-d1','sp1-d1','sorewa-d1','strength-d1','death-d1'];
  const img = document.getElementById('work');
  const k = WORKS[Math.floor(Math.random()*WORKS.length)];
  img.onload = () => img.classList.remove('loading');
  img.src = `img/${k}.jpg`;

  const door = document.getElementById('door');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let x = innerWidth/2, y = innerHeight/2, tx = x, ty = y, last = performance.now(), t0 = performance.now();
  const set = () => { door.style.setProperty('--x', x+'px'); door.style.setProperty('--y', y+'px'); };
  addEventListener('pointermove', e => { tx = e.clientX; ty = e.clientY; last = performance.now(); });
  addEventListener('resize', () => { tx = innerWidth/2; ty = innerHeight/2; });
  set();
  function frame(now){
    // when nobody is looking, the hole drifts slowly on its own
    if (!reduce && now - last > 2500){
      const t = (now - t0)/1000;
      tx = innerWidth*(.5 + .22*Math.sin(t*.13)); ty = innerHeight*(.48 + .18*Math.sin(t*.21 + 1.3));
    }
    const k = reduce ? 1 : .08;
    x += (tx - x)*k; y += (ty - y)*k; set();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
