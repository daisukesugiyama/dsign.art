<script>(()=>{const L=['ja','en','zh'],r=document.documentElement;let s=null;try{s=localStorage.getItem('dsign-lang')}catch(e){}const q=new URLSearchParams(location.search).get('lang');const n=(navigator.language||'ja').toLowerCase();const l=L.includes(q)?q:L.includes(s)?s:n.startsWith('ja')?'ja':n.startsWith('zh')?'zh':'en';r.dataset.lang=l;r.lang=l==='zh'?'zh-Hans':l;if(L.includes(q)){try{localStorage.setItem('dsign-lang',q)}catch(e){}}})();</script>

<style>
/* The door. It opens on the torso at full size and pulls back to the whole work on the wall,
   the same movement as the reels. A click anywhere goes in. */
:root{--wall:#ebe9e6;--ink:#24211d;--ink-soft:#6c665e;color-scheme:light}
html{touch-action:none}  /* the door never zooms or pans; a tap goes in */
html,body{margin:0;height:100%;background:var(--wall) url(img/washi.jpg) 0 0/768px repeat;background-blend-mode:overlay;color:var(--ink)}
body{overflow:hidden;font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
html[data-lang="ja"] [data-l]:not([data-l="ja"]),html[data-lang="en"] [data-l]:not([data-l="en"]),html[data-lang="zh"] [data-l]:not([data-l="zh"]){display:none!important}
.door{position:fixed;inset:0}
.door-stage{position:absolute;inset:0}
.door-static{display:none;position:absolute;left:7%;right:7%;top:12%;bottom:22%;width:86%;height:66%;object-fit:contain}
.door.is-static .door-static{display:block}
.enter{position:absolute;inset:0;z-index:4;display:block;color:inherit;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.enter:focus-visible{outline:2px solid #1f6a7c;outline-offset:-6px}
.mark{position:absolute;z-index:5;left:max(24px,3vw);top:calc(22px + env(safe-area-inset-top,0px));pointer-events:none;
  font-family:"EB Garamond",Garamond,serif;font-weight:500;font-size:28px;line-height:1;letter-spacing:.02em}
.mark .kd{margin-right:-.09em}.mark .kp{margin-right:-.04em}
.label,.go,.line{position:absolute;z-index:5;margin:0;pointer-events:none;opacity:0;transition:opacity 1.2s ease}
.label{font-family:"EB Garamond",Garamond,serif;font-size:17px;line-height:1.45;letter-spacing:.02em}
.label span{display:block;font-size:15px;color:var(--ink-soft)}
.go{font-size:14px;letter-spacing:.1em;text-align:right;text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1px}
.line{left:0;right:0;bottom:calc(30px + env(safe-area-inset-bottom,0px));text-align:center;padding-inline:20px;
  font-family:"EB Garamond",Garamond,serif;font-size:clamp(17px,1.7vw,22px);letter-spacing:.01em;color:var(--ink)}
.door-done .label,.door-done .go,.door-done .line{opacity:1}
.door-done .line{transition-delay:.5s}
@media (prefers-reduced-motion:reduce){.label,.go,.line{transition:none}}
</style>
</head>
<body>
<div class="door" data-door data-dzi="torso/001/tiles.dzi" data-w="10630" data-h="5950" data-tx="1890" data-ty="3150">
  <div class="door-stage" aria-hidden="true"></div>
  <img class="door-static" src="torso/001/img/whole-2400.jpg" alt="" width="2400" height="1343">
  <a class="enter" href="home.html" aria-label="D.sign に入る / Enter D.sign / 进入 D.sign"></a>
  <span class="mark" aria-hidden="true"><span class="kd">D</span><span class="kp">.</span>sign</span>
  <p class="label" aria-hidden="true">TORSO No.001<span>2026　90 × 50.38 cm</span></p>
  <p class="go" aria-hidden="true"><span data-l="ja">D.sign に入る</span><span data-l="en">Enter D.sign</span><span data-l="zh" lang="zh-Hans">进入 D.sign</span></p>
  <p class="line" lang="en">Images about looking and the trouble with wanting.</p>
</div>
